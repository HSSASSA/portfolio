<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio – Data & AI Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Cursor -->
  <div class="cursor" id="cursor"></div>

  <!-- Nav -->
  <nav id="navbar">
    <div class="nav-logo" id="nav-name">AH</div>
    
    <div class="nav-actions">
      <!-- Language Toggle -->
      <button id="lang-toggle" class="toggle-btn" type="button" aria-label="Toggle language">
        <span class="lang-text">EN</span>
        <span class="lang-separator">/</span>
        <span class="lang-text">FR</span>
      </button>

      <!-- Theme Toggle -->
      <button id="theme-toggle" class="toggle-btn theme-toggle" type="button" aria-label="Toggle theme">
        <span class="theme-icon sun">☀︎</span>
        <span class="theme-icon moon">☽</span>
      </button>
    </div>

    <ul class="nav-links" id="nav-links"></ul>
    
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Hero -->
  <section class="hero" id="home">
    <div class="hero-grid-bg"></div>
    <div class="hero-content">
      <div class="hero-tag" id="hero-tag"></div>
      <h1 class="hero-name" id="hero-name"></h1>
      <p class="hero-title" id="hero-title"></p>
      <p class="hero-bio" id="hero-bio"></p>
      <div class="hero-cta">
        <a id="btn-view-experience" href="#experience" class="btn btn-primary">View Experiences</a>
        <a id="btn-contact-me" href="#contact" class="btn btn-ghost">Contact Me</a>
      </div>
    </div>
    <div class="hero-orbs">
      <div class="orb orb1"></div>
      <div class="orb orb2"></div>
      <div class="orb orb3"></div>
    </div>
    <div class="scroll-indicator">
      <span id="scroll-label">scroll</span>
      <div class="scroll-line"></div>
    </div>
  </section>

  <!-- Skills -->
  <section class="section" id="skills">
    <div class="container">
      <div class="section-header">
        <span class="section-number">01</span>
        <h2 id="skills-title" class="section-title">Expertise & Skills</h2>
      </div>
      <div class="domains-grid" id="domains-grid"></div>
      <div class="skills-marquee">
        <div class="marquee-track" id="marquee-track"></div>
      </div>
    </div>
  </section>

  <!-- Experience -->
  <section class="section section-dark" id="experience">
    <div class="container">
      <div class="section-header">
        <span class="section-number">02</span>
        <h2 id="experience-title" class="section-title">Experiences</h2>
      </div>
      <div class="timeline" id="timeline"></div>
    </div>
  </section>

  <!-- Projects -->
  <section class="section" id="projects">
    <div class="container">
      <div class="section-header">
        <span class="section-number">03</span>
        <h2 id="projects-title" class="section-title">Projects</h2>
      </div>
      <div class="projects-grid" id="projects-grid"></div>
    </div>
  </section>

  <!-- Education & Certs -->
  <section class="section section-dark" id="education">
    <div class="container">
      <div class="section-header">
        <span class="section-number">04</span>
        <h2 id="education-title" class="section-title">Education & Certifications</h2>
      </div>
      <div class="edu-cert-grid">
        <div>
          <h3 class="subsection-title">Education</h3>
          <div id="education-list"></div>
        </div>
        <div>
          <h3 class="subsection-title">Certifications</h3>
          <div id="certs-list"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Extracurricular -->
  <section class="section" id="activities">
    <div class="container">
      <div class="section-header">
        <span class="section-number">05</span>
        <h2 id="activities-title" class="section-title">Leadership & Activities</h2>
      </div>
      <div class="activities-grid" id="activities-grid"></div>
    </div>
  </section>

  <!-- Contact -->
  <section class="section section-dark" id="contact">
    <div class="container contact-container">
      <div class="section-header">
        <span class="section-number">06</span>
        <h2 id="contact-title" class="section-title">Get In Touch</h2>
      </div>
      <p class="contact-intro" id="contact-intro"></p>
      <div class="contact-links" id="contact-links"></div>
    </div>
  </section>

  <footer>
    <p id="footer-text"></p>
  </footer>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
